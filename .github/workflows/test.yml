name: test

# Typecheck, tests, lint and a secrets scan on every push to main and every
# PR. The job's name, `test`, is the check main's ruleset requires once it has
# first reported.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same pull request cancels the older run; pushes to main
# each keep their own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      # The pinned gitleaks binary with redacted output, over the commits this
      # run adds. On a first push `before` is all zeros, and after a force-push
      # it is a commit this clone lacks: scan everything in both cases, because
      # gitleaks exits 0 with nothing scanned when the range is invalid.
      - name: Secrets
        env:
          GITLEAKS_VERSION: "8.30.1"
          SECRETS_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          if [ -z "${SECRETS_BASE}" ] || [ "${SECRETS_BASE}" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${SECRETS_BASE}^{commit}" 2>/dev/null; then
            /tmp/gitleaks git . --config .gitleaks.toml --redact --no-banner
          else
            /tmp/gitleaks git . --config .gitleaks.toml --redact --no-banner --log-opts "${SECRETS_BASE}..HEAD"
          fi

  # The tests again on the oldest Node that package.json's `engines` allows,
  # as a job of its own: a matrix would rename `test`, the check main's
  # ruleset requires.
  floor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - run: npm ci

      - name: Tests
        run: npm test
